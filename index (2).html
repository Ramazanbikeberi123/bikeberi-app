<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Байк Бери</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#1f2937;font:15px/1.4 -apple-system,"Segoe UI",Arial,sans-serif}
.top{background:#0b0b0f;color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center}
.top b{font-weight:600}.top .r{background:#fff;color:#111;border-radius:8px;padding:6px 12px;font-size:13px}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:#e5e7eb}
nav button{white-space:nowrap;border:2px solid #1f2937;background:#fff;color:#1f2937;border-radius:12px;padding:8px 14px;font-size:14px}
nav button.on{background:#fff1e6;border-color:#f97316;color:#c2410c}
main{padding:14px 12px 110px;max-width:640px;margin:auto}
.card{background:#fff;border-radius:14px;border:1px solid #e5e7eb;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0}
.big{font-size:26px;font-weight:700;margin-top:10px}.lbl{color:#6b7280;font-size:13px}
h2{font-size:16px;margin:0 0 10px}h1{font-size:24px;margin:4px 0 12px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;white-space:nowrap}
td,th{padding:9px 8px;border-bottom:1px solid #f0f0f0;text-align:left}th{color:#9ca3af;font-weight:400}
.bars{display:flex;gap:8px;align-items:flex-end;height:120px}
.bars div{flex:1;text-align:center;font-size:11px;color:#6b7280}.bars i{display:block;background:#fb923c;border-radius:6px 6px 0 0;margin-bottom:4px}
.line{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f3f4f6}.line:last-child{border:0}
.pill{border-radius:999px;padding:3px 10px;font-size:12px}.ok{background:#dcfce7;color:#166534}.no{background:#1f2937;color:#fff}.cl{background:#e5e7eb;color:#374151}.low{color:#c2410c;font-weight:600}
.btn{width:100%;padding:13px;border:2px solid #1f2937;border-radius:12px;background:#fff;color:#1f2937;font-size:15px;margin-top:8px}
input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;background:#fff;color:#1f2937;font-size:16px;margin:4px 0 12px}
label{font-size:13px;color:#6b7280}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f3f4f6}.n{flex:1}small{color:#9ca3af}
button.q{width:38px;height:38px;border-radius:50%;border:0;background:#f97316;color:#fff;font-size:20px}.qty{min-width:22px;text-align:center}
#go{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:15px;border:0;border-radius:12px;background:#f97316;color:#fff;font-size:17px;font-weight:600}
#go:disabled{opacity:.4}.hide{display:none}
</style></head><body>
<div class="top"><div><b>Байк Бери</b> <span id="crumb"></span></div><span class="r" id="role"></span></div>
<nav id="nav" class="hide"></nav>
<main>
<section id="form" class="hide">
<h1>Новый ремонт</h1>
<div class="card">
<label>Номер велосипеда (необязательно)</label><input id="b" placeholder="например: U2 №015" maxlength="20">
<label>Что сделал</label><input id="d" placeholder="например: замена тормозных колодок" maxlength="150">
<label>Запчасти</label><input id="s" placeholder="поиск: колод, камера, фара…">
<div id="list"></div></div>
<div class="card" id="sum"></div>
<div class="card"><label>Сколько взял с клиента всего, ₽</label>
<input id="p" type="number" inputmode="numeric" placeholder="0"><div id="calc"></div></div>
<button id="go" disabled>Отправить боту</button>
</section>
<section id="admin" class="hide"></section>
</main>
<script>
const CAT=[[42, "Амортизаторы задние пружинно-масляные U2 340 мм (пара/чёрный)", 3780], [35, "Держатель для телефона", 640], [31, "Задний дисковый тормоз в сборе", 5780], [29, "Задний тормозной диск 220 мм", 2310], [21, "Задняя часть передней облицовочной панели (WHITE)", 500], [34, "Замок с ключами", 1140], [7, "Зарядное устройство 60 В, 8 А", 4130], [4, "Зеркала заднего вида", 990], [2, "К-кт подшипников вилки", 500], [6, "Камера колеса", 660], [27, "Колесо 2,15–12 с алюминиевым ободом", 4930], [3, "Колодки тормозные", 640], [26, "Контроллер 40A для 60V/48V", 4930], [37, "Крыло заднее на U2", 2130], [22, "Левая боковая панель (WHITE)", 970], [24, "Левая декоративная накладка защитной панели (SILVER)", 330], [14, "Левая подножка (пластик)", 330], [33, "Левая ручка", 1470], [5, "Ниппель для колеса", 120], [9, "Ось переднего колеса со втулками", 740], [19, "Переднее крыло (WHITE)", 1630], [10, "Передние амортизаторы", 4930], [46, "Передний амортизатор (гарантия, счёт №3)", 0], [30, "Передний дисковый тормоз в сборе", 5450], [20, "Передняя облицовочная панель (WHITE)", 1630], [18, "Передняя фара", 3280], [45, "Передняя фара (гарантия, счёт №3)", 0], [38, "Пластиковый отсек под АКБ («унитаз») на U2", 2130], [17, "Платформа для ног", 970], [40, "Поворотники задние на U2", 1470], [39, "Поворотники передние на U2", 1470], [1, "Подшипник переднего колеса (6201)", 170], [12, "Покрышка 90/90/12", 2970], [23, "Правая боковая панель (WHITE)", 970], [25, "Правая декоративная накладка защитной панели (SILVER)", 330], [15, "Правая подножка (пластик)", 330], [32, "Правая ручка газа", 1630], [41, "Провод АКБ (6к / усиленный)", 1470], [13, "Провод на мотор-колесо", 990], [36, "Рулевая колонка", 3280], [8, "Ручка для АКБ", 480], [43, "Ручка тормоза обычная на U2 (левая)", 400], [44, "Ручка тормоза обычная на U2 (правая)", 400], [28, "Тормозной диск 220мм", 2310], [11, "Траверса", 3280], [16, "Центральная облицовочная панель (WHITE)", 480]];
const M=Object.fromEntries(CAT.map(c=>[c[0],c]));
const tg=window.Telegram.WebApp;tg.ready();tg.expand();
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const raw=new URLSearchParams(location.search).get('d');
let D=null;
try{if(raw)D=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(raw.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))))}catch(e){}
/* ---------- форма мастера ---------- */
const cart={};
function render(){
  const w=$('s').value.trim().toLowerCase();
  const items=CAT.filter(c=>!w||c[1].toLowerCase().includes(w)).slice(0,30);
  $('list').innerHTML=items.map(c=>'<div class="row"><div class="n">'+esc(c[1])+'<br><small>'+fmt(c[2])+'</small></div>'
    +'<button class="q" data-id="'+c[0]+'" data-d="-1">−</button><span class="qty">'+(cart[c[0]]||0)
    +'</span><button class="q" data-id="'+c[0]+'" data-d="1">+</button></div>').join('')||'<small>Ничего не найдено</small>';
  update();
}
function update(){
  const ids=Object.keys(cart).filter(i=>cart[i]>0);
  const pt=ids.reduce((s,i)=>s+cart[i]*M[i][2],0);
  $('sum').innerHTML=ids.length?'<h2>Выбрано</h2>'+ids.map(i=>esc(M[i][1])+' ×'+cart[i]).join('<br>')+'<br><b>Запчасти: '+fmt(pt)+'</b>':'<span class="lbl">Запчасти не выбраны</span>';
  const p=+$('p').value||0;
  $('calc').innerHTML=p?(p>=pt?'Работа: <b>'+fmt(p-pt)+'</b>':'<span style="color:#d33">Сумма меньше запчастей ('+fmt(pt)+')</span>'):'<span class="lbl">Введи сумму с клиента</span>';
  $('go').disabled=!($('d').value.trim()&&p>0&&p>=pt);
}
function startForm(){
  $('crumb').textContent='/ Новый ремонт';$('role').textContent='Мастер';$('form').classList.remove('hide');
  $('list').onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.id;
    cart[id]=Math.max(0,Math.min(50,(cart[id]||0)+(+b.dataset.d)));b.parentNode.querySelector('.qty').textContent=cart[id];update();};
  $('s').oninput=render;$('d').oninput=update;$('p').oninput=update;
  $('go').onclick=()=>tg.sendData(JSON.stringify({b:$('b').value.trim(),d:$('d').value.trim(),
    p:Object.keys(cart).filter(i=>cart[i]>0).map(i=>[+i,cart[i]]),t:+$('p').value}));
  render();
}
/* ---------- панель администратора ---------- */
const ST={1:['На смене','ok'],0:['Не вышел','no'],2:['Смена закрыта','cl']};
function rep(rows){return rows.length?'<div class="sc"><table><tr><th>№</th><th>Велосипед</th><th>Работа</th><th>Мастер</th><th>Сумма</th></tr>'
  +rows.map(r=>'<tr><td><b>P-'+r[0]+'</b></td><td>'+esc(r[1]||'—')+'</td><td>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td><td>'+fmt(r[4])+'</td></tr>').join('')+'</table></div>':'<span class="lbl">Ремонтов пока нет</span>';}
function people(){return D.m.map(m=>'<div class="line"><b>'+esc(m[0])+'</b><span class="pill '+ST[m[1]][1]+'">'+ST[m[1]][0]+'</span></div>').join('')||'<span class="lbl">Мастеров нет</span>';}
const VIEWS={
 'Главная':()=>{const T=D.t,mx=Math.max(1,...D.w),day=new Date();
  const bars=D.w.map((v,i)=>{const d=new Date(day-(6-i)*864e5);return '<div><i style="height:'+Math.round(v/mx*90)+'px"></i>'+d.getDate()+'.'+String(d.getMonth()+1).padStart(2,'0')+'</div>'}).join('');
  return '<h1>Главная</h1><div class="grid"><div class="card"><div class="lbl">Выручка сегодня</div><div class="big">'+fmt(T[0])+'</div></div>'
  +'<div class="card"><div class="lbl">Ремонтов сегодня</div><div class="big">'+T[1]+'</div></div>'
  +'<div class="card"><div class="lbl">Мастера на смене</div><div class="big">'+T[2]+' из '+T[3]+'</div></div>'
  +'<div class="card"><div class="lbl">Начислено мастерам</div><div class="big">'+fmt(T[4])+'</div></div></div><div style="height:12px"></div>'
  +'<div class="card"><h2>Последние ремонты</h2>'+rep(D.r.slice(0,4))+'<button class="btn" onclick="go(\'Ремонты\')">Все ремонты →</button></div>'
  +'<div class="card"><h2>Выручка за 7 дней</h2><div class="bars">'+bars+'</div></div>'
  +'<div class="card"><h2>Сотрудники сегодня</h2>'+people()+'</div>'
  +'<div class="card"><h2>Быстрые действия</h2><button class="btn" onclick="go(\'Склад\')">Открыть склад</button><button class="btn" onclick="tg.close()">Закрыть панель</button></div>';},
 'Мастера':()=>'<h1>Мастера</h1>'+(D.m.map(m=>'<div class="card"><div class="line"><b>'+esc(m[0])+'</b><span class="pill '+ST[m[1]][1]+'">'+ST[m[1]][0]+'</span></div><span class="lbl">Ставка '+m[2]+' ₽/ч · процент с работы '+m[3]+'%</span></div>').join('')||'<div class="card">Мастеров нет</div>'),
 'Ремонты':()=>'<h1>Ремонты</h1><div class="card">'+rep(D.r)+'<div class="lbl" style="margin-top:8px">Показаны последние ремонты. Полный отчёт: кнопки «Сегодня» и «7 дней» в боте.</div></div>',
 'Склад':()=>{const S=Object.fromEntries(D.s);const rows=CAT.filter(c=>c[0] in S).sort((a,b)=>S[a[0]]-S[b[0]]);
  return '<h1>Склад</h1><div class="card">'+rows.map(c=>'<div class="line"><span>'+esc(c[1])+'</span><span class="'+(S[c[0]]<=2?'low':'')+'">'+S[c[0]]+(S[c[0]]<=2?' ⚠️':'')+'</span></div>').join('')+'</div>';}
};
function go(t){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.textContent===t));
  $('crumb').textContent='/ '+t;$('admin').innerHTML=VIEWS[t]();window.scrollTo(0,0);}
function startAdmin(){
  $('role').textContent='Администратор';$('admin').classList.remove('hide');$('nav').classList.remove('hide');
  $('nav').innerHTML=Object.keys(VIEWS).map(t=>'<button>'+t+'</button>').join('');
  $('nav').onclick=e=>{if(e.target.tagName==='BUTTON')go(e.target.textContent)};go('Главная');
}
if(D)startAdmin();else startForm();
</script></body></html>
